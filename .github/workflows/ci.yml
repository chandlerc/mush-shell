name: CI

on:
  push:
    branches: [trunk]
  pull_request:

permissions:
  contents: read

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          # TODO: Switch to `block` with an `allowed-endpoints` list once the
          # first runs have recorded the endpoints this job uses.
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1

  clippy:
    # The code's `cfg`s depend only on the OS.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, macos-26]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          # TODO: Switch to `block` with an `allowed-endpoints` list once the
          # first runs have recorded the endpoints this job uses. macOS
          # supports only `audit`.
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    # The current Ubuntu LTS and macOS releases. Mush does not support
    # Windows.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm, macos-26]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          # TODO: Switch to `block` with an `allowed-endpoints` list once the
          # first runs have recorded the endpoints this job uses. macOS
          # supports only `audit`.
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest
      # Every failure in one run, not just the first on each platform.
      - run: cargo nextest run --locked --workspace --no-fail-fast

  fuzz:
    # Runs each target briefly to show it builds and holds its contract on
    # the seeds. Real fuzzing is manual; see docs/testing.md.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          # TODO: Switch to `block` with an `allowed-endpoints` list once the
          # first runs have recorded the endpoints this job uses.
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install nightly --profile minimal --component clippy
          rustup default nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-fuzz
      # `cargo fuzz` has no --locked, so this step also holds the fuzz
      # workspace to its lockfile.
      - run: cargo clippy --locked --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
      - name: Fuzz each target for 30 seconds
        run: |
          targets=$(cargo fuzz list --fuzz-dir fuzz)
          for target in $targets; do
            # libFuzzer writes new inputs into the first corpus directory.
            # -max_len exceeds the 8 KiB line limit. The prebuilt cargo-fuzz
            # is a musl binary and builds for musl by default, which
            # AddressSanitizer does not support, so --target picks glibc.
            mkdir -p "$RUNNER_TEMP/fuzz/$target"
            cargo fuzz run --fuzz-dir fuzz --target x86_64-unknown-linux-gnu \
              "$target" "$RUNNER_TEMP/fuzz/$target" "fuzz/seeds/$target" \
              -- -dict=fuzz/mush.dict -max_total_time=30 -max_len=65536 \
                 -print_final_stats=1
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  release:
    # Builds the shipping binaries as README.md's install instructions do:
    # the release profile, statically linked against musl on Linux.
    # TODO: Once Mush is ready for releases, publish these binaries as a
    # GitHub release when every job passes.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-26
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          # TODO: Switch to `block` with an `allowed-endpoints` list once the
          # first runs have recorded the endpoints this job uses. macOS
          # supports only `audit`.
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # aws-lc-sys and ring compile C in their build scripts.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - run: cargo build --locked --release --target ${{ matrix.target }} -p mush
      - name: Check the binary's linkage, and that it runs
        run: |
          bin=target/${{ matrix.target }}/release/mush
          if [ "$RUNNER_OS" = Linux ]; then
            file "$bin" | grep -F 'static'
          else
            otool -L "$bin"
            if otool -L "$bin" | tail -n +2 |
              grep -v -E '^[[:space:]]+/(usr/lib|System/Library)/'; then
              echo 'The binary links libraries that are not part of macOS.' >&2
              exit 1
            fi
          fi
          "$bin" --version

  lab:
    # The AppArmor user namespace sysctl below is specific to Ubuntu.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          # TODO: Switch to `block` with an `allowed-endpoints` list once the
          # first runs have recorded the endpoints this job uses.
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest
      - name: Set up the lab
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          # rsync and git are for the compatibility tests, which skip
          # without them.
          sudo apt-get install -y --no-install-recommends openssh-server nftables conntrack rsync git
          # Module autoloading is unreliable inside a user namespace, so load
          # what the lab needs up front: netem for link conditions, and
          # ctnetlink for the NAT-rebind tests' conntrack flush.
          sudo modprobe -a sch_netem nf_conntrack_netlink
      # The lab tests run the `mush` binary, which building the tests does not
      # produce.
      - run: cargo build --locked -p mush
      - name: Run the lab suite
        run: |
          set -o pipefail
          cargo nextest run --locked --no-fail-fast --profile lab -p mush-lab 2>&1 | tee lab.log
      - name: Fail if any lab test skipped
        run: |
          if grep -F MUSH-LAB-SKIP lab.log; then
            echo 'Lab tests skipped; CI must run all of them.' >&2
            exit 1
          fi
